name: Lane 0 Release Gate

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.promoted
  workflow_dispatch:
    inputs:
      phase:
        description: Gate phase to verify manually
        required: true
        type: choice
        options:
          - pre-alias
          - post-alias
      deployment_url:
        description: Exact Vercel deployment URL
        required: true
        type: string
      deployment_id:
        description: Exact Vercel deployment ID
        required: true
        type: string
      git_sha:
        description: Exact 40-character deployed Git SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: lane0-${{ github.event.action || inputs.phase }}-${{ github.event.client_payload.id || inputs.deployment_id }}
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: prj_ZuPBD1Fq8IKGPR6tisulMaviONL2
  EXPECTED_PROJECT_NAME: 3d-illuminated-signs
  EXPECTED_GIT_REF: main
  DEPLOYMENT_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.url || inputs.deployment_url }}
  EXPECTED_DEPLOYMENT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.id || inputs.deployment_id }}
  EXPECTED_GIT_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || inputs.git_sha }}
  ROLLBACK_DEPLOYMENT_ID: ${{ vars.LANE0_ROLLBACK_DEPLOYMENT_ID || 'dpl_3VyaxZfsveNRJiYjevRAtnkQUHcH' }}

jobs:
  pre-alias:
    name: lane-0-pre-alias
    if: >-
      github.event.action == 'vercel.deployment.ready' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'pre-alias')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report the blocking deployment status
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: "Vercel - 3d-illuminated-signs: lane-0-pre-alias"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the exact production candidate
        env:
          EVENT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          EVENT_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          EVENT_PROJECT_NAME: ${{ github.event.client_payload.project.name }}
          EVENT_GIT_REF: ${{ github.event.client_payload.git.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            [[ "$EVENT_ENVIRONMENT" == "production" ]]
            [[ "$EVENT_PROJECT_ID" == "$EXPECTED_PROJECT_ID" ]]
            [[ "$EVENT_PROJECT_NAME" == "$EXPECTED_PROJECT_NAME" ]]
            [[ "$EVENT_GIT_REF" == "$EXPECTED_GIT_REF" ]]
          fi
          [[ "$EXPECTED_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          node -e 'const url = new URL(process.env.DEPLOYMENT_URL); if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/") process.exit(1)'

      - name: Check out the deployed revision
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          ref: ${{ env.EXPECTED_GIT_SHA }}
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the strict pre-alias route and identity audit
        env:
          AUDIT_REQUIRE_IDENTITY: "1"
          AUDIT_EXPECTED_PROJECT_ID: ${{ env.EXPECTED_PROJECT_ID }}
          AUDIT_EXPECTED_DEPLOYMENT_ID: ${{ env.EXPECTED_DEPLOYMENT_ID }}
          AUDIT_EXPECTED_GIT_SHA: ${{ env.EXPECTED_GIT_SHA }}
          AUDIT_ALLOW_VERCEL_DEPLOYMENT_NOINDEX: "1"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run --silent audit:site -- "$DEPLOYMENT_URL" | tee artifacts/lane0-audit-pre-alias.json

      - name: Run the signed pre-alias QA canary
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.DEPLOYMENT_URL }}
          QA_CANARY_AUTH_TOKEN: ${{ secrets.QA_CANARY_AUTH_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/lane0-qa-pre-alias.json
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx playwright install --with-deps chromium
          npx playwright test --reporter=json

      - name: Write the pre-alias release record
        if: always()
        env:
          LANE0_PHASE: pre-alias
          LANE0_EVENT: ${{ github.event.action || 'workflow_dispatch' }}
          LANE0_RESULT: ${{ job.status }}
          AUDIT_REPORT_PATH: artifacts/lane0-audit-pre-alias.json
          QA_REPORT_PATH: artifacts/lane0-qa-pre-alias.json
          RELEASE_RECORD_PATH: artifacts/release-record-pre-alias.json
          TESTED_URL: ${{ env.DEPLOYMENT_URL }}
        run: npm run --silent release:record

      - name: Retain the pre-alias evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane0-release-evidence-${{ env.EXPECTED_DEPLOYMENT_ID }}-pre-alias
          path: |
            artifacts/
            .next/playwright-results/
          if-no-files-found: warn
          retention-days: 90

  post-alias:
    name: lane-0-post-alias
    if: >-
      github.event.action == 'vercel.deployment.promoted' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'post-alias')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the exact promoted deployment
        env:
          EVENT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          EVENT_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          EVENT_PROJECT_NAME: ${{ github.event.client_payload.project.name }}
          EVENT_GIT_REF: ${{ github.event.client_payload.git.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            [[ "$EVENT_ENVIRONMENT" == "production" ]]
            [[ "$EVENT_PROJECT_ID" == "$EXPECTED_PROJECT_ID" ]]
            [[ "$EVENT_PROJECT_NAME" == "$EXPECTED_PROJECT_NAME" ]]
            [[ "$EVENT_GIT_REF" == "$EXPECTED_GIT_REF" ]]
          fi
          [[ "$EXPECTED_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the deployed revision
        uses: vercel/repository-dispatch/actions/checkout@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          ref: ${{ env.EXPECTED_GIT_SHA }}
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit the public apex and release identity
        env:
          AUDIT_REQUIRE_IDENTITY: "1"
          AUDIT_EXPECTED_PROJECT_ID: ${{ env.EXPECTED_PROJECT_ID }}
          AUDIT_EXPECTED_DEPLOYMENT_ID: ${{ env.EXPECTED_DEPLOYMENT_ID }}
          AUDIT_EXPECTED_GIT_SHA: ${{ env.EXPECTED_GIT_SHA }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run --silent audit:site -- "https://3dilluminatedsigns.com.au" | tee artifacts/lane0-audit-post-alias.json

      - name: Verify the www hostname serves the same release
        run: |
          mkdir -p artifacts
          node <<'NODE' | tee artifacts/lane0-www-post-alias.json
          const response = await fetch("https://www.3dilluminatedsigns.com.au/", { redirect: "follow" });
          const expected = {
            project: process.env.EXPECTED_PROJECT_ID,
            deployment: process.env.EXPECTED_DEPLOYMENT_ID,
            sha: process.env.EXPECTED_GIT_SHA,
          };
          const observed = {
            project: response.headers.get("x-release-project-id") || "",
            deployment: response.headers.get("x-release-deployment-id") || "",
            sha: response.headers.get("x-release-git-sha") || "",
          };
          const hostname = new URL(response.url).hostname;
          if (response.status !== 200 || !["3dilluminatedsigns.com.au", "www.3dilluminatedsigns.com.au"].includes(hostname)) process.exitCode = 1;
          if (JSON.stringify(observed) !== JSON.stringify(expected)) process.exitCode = 1;
          console.log(JSON.stringify({ status: response.status, finalUrl: response.url, expected, observed }, null, 2));
          NODE

      - name: Run the signed public QA canary
        env:
          PLAYWRIGHT_BASE_URL: https://3dilluminatedsigns.com.au
          QA_CANARY_AUTH_TOKEN: ${{ secrets.QA_CANARY_AUTH_TOKEN }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/lane0-qa-post-alias.json
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx playwright install --with-deps chromium
          npx playwright test --reporter=json

      - name: Write the post-alias release record
        if: always()
        env:
          LANE0_PHASE: post-alias
          LANE0_EVENT: ${{ github.event.action || 'workflow_dispatch' }}
          LANE0_RESULT: ${{ job.status }}
          AUDIT_REPORT_PATH: artifacts/lane0-audit-post-alias.json
          QA_REPORT_PATH: artifacts/lane0-qa-post-alias.json
          WWW_REPORT_PATH: artifacts/lane0-www-post-alias.json
          RELEASE_RECORD_PATH: artifacts/release-record-post-alias.json
          TESTED_URL: https://3dilluminatedsigns.com.au
          PUBLIC_HOST: 3dilluminatedsigns.com.au
        run: npm run --silent release:record

      - name: Retain the post-alias evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane0-release-evidence-${{ env.EXPECTED_DEPLOYMENT_ID }}-post-alias
          path: |
            artifacts/
            .next/playwright-results/
          if-no-files-found: warn
          retention-days: 90
